name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Test addon build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build addon
        uses: home-assistant/builder@2024.03.5
        with:
          args: |
            --test \
            --amd64 --aarch64 --armv7 \
            --target unbound \
            --image {arch}-addon-unbound \
            --docker-hub cgfm
